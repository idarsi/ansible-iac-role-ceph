name: Quick checks

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: |
          python -m pip install "ansible-core==2.19.12" "molecule==26.8.0" "molecule-plugins[podman]==26.7.15" "ansible-lint==26.8.0"
          retry() {
            local attempts=3 delay=10 attempt=1
            while ! "$@"; do
              if (( attempt >= attempts )); then
                return 1
              fi
              echo "Command failed; retrying in ${delay}s (${attempt}/${attempts})..."
              sleep "$delay"
              ((attempt += 1))
            done
          }
          retry ansible-galaxy collection install containers.podman:1.20.2
          retry ansible-galaxy collection install ansible.posix:2.1.0
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Run validation contract scenario
        run: molecule test -s validation
      - name: Run mocked install contract scenario
        run: molecule test -s install-mock
      - name: Run production lint
        run: ansible-lint
      - name: Check example playbook syntax
        run: ansible-playbook --syntax-check -i docs/inventory-minimal.yml docs/playbook-example.yml
