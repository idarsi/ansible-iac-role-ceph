---
###############################################################################
#
# validate_inventory.yml
#
# @author Arsi Atomi
#
###############################################################################

- name: "Checking requested ceph state"
  ansible.builtin.assert:
    that:
      - iac_state in ["validate", "install"]
    fail_msg: "state must be validate or install"

- name: "Checking ceph blueprint mapping"
  ansible.builtin.assert:
    that:
      - iac_blueprint.ceph | type_debug == "dict"
    fail_msg: "iac_blueprint.ceph must be a mapping"

- name: "Checking ceph cluster name"
  ansible.builtin.assert:
    that:
      - iac_blueprint.ceph.cluster_name is defined
      - iac_blueprint.ceph.cluster_name is string
      - iac_blueprint.ceph.cluster_name | length > 0
      - iac_blueprint.ceph.cluster_name == "ceph"
    fail_msg: "ceph.cluster_name must be 'ceph'; custom cluster names are unsupported"

- name: "Checking monitor topology"
  ansible.builtin.assert:
    that:
      - iac_blueprint.ceph.monitors is defined
      - iac_blueprint.ceph.monitors | type_debug == "list"
      - iac_blueprint.ceph.monitors | length >= 3
      - iac_blueprint.ceph.monitors | length % 2 == 1
      - iac_blueprint.ceph.monitors | unique | length == iac_blueprint.ceph.monitors | length
      - inventory_hostname in iac_blueprint.ceph.monitors
    fail_msg: "ceph.monitors must be a unique odd-sized list of at least three inventory hosts including the current bootstrap host"

- name: "Checking OSD device definitions"
  ansible.builtin.assert:
    that:
      - iac_blueprint.ceph.osds | default([]) | type_debug == "list"
      - >-
        (iac_blueprint.ceph.osds | default([]) | select('mapping') | list | length)
        == (iac_blueprint.ceph.osds | default([]) | length)
      - >-
        (iac_blueprint.ceph.osds | default([]) | selectattr('host', 'defined') | list | length)
        == (iac_blueprint.ceph.osds | default([]) | length)
      - >-
        (iac_blueprint.ceph.osds | default([]) | selectattr('device', 'defined') | list | length)
        == (iac_blueprint.ceph.osds | default([]) | length)
      - >-
        (iac_blueprint.ceph.osds | default([]) | selectattr('host', 'defined')
        | selectattr('host', 'string') | rejectattr('host', 'equalto', '') | list | length)
        == (iac_blueprint.ceph.osds | default([]) | length)
      - >-
        (iac_blueprint.ceph.osds | default([]) | selectattr('device', 'defined')
        | selectattr('device', 'string') | rejectattr('device', 'equalto', '') | list | length)
        == (iac_blueprint.ceph.osds | default([]) | length)
      - >-
        (iac_blueprint.ceph.osds | default([]) | selectattr('device', 'defined')
        | selectattr('device', 'string') | select('match', '^/dev/[A-Za-z0-9._/-]+$') | list | length)
        == (iac_blueprint.ceph.osds | default([]) | length)
      - >-
        (iac_blueprint.ceph.osds | default([]) | selectattr('device', 'defined')
        | selectattr('device', 'string') | reject('search', '/\\.\\.') | list | length)
        == (iac_blueprint.ceph.osds | default([]) | length)
      - >-
        (iac_blueprint.ceph.osds | default([]) | selectattr('host', 'in', hostvars) | list | length)
        == (iac_blueprint.ceph.osds | default([]) | length)
      - >-
        (iac_blueprint.ceph.osds | default([]) | map(attribute='device') | unique | list | length)
        == (iac_blueprint.ceph.osds | default([]) | length)
    fail_msg: "OSDs require unique explicit /dev device paths on declared inventory hosts; automatic discovery is unsupported"

- name: "Checking pool definitions"
  ansible.builtin.assert:
    that:
      - iac_blueprint.ceph.pools | default([]) | type_debug == "list"
      - >-
        (iac_blueprint.ceph.pools | default([]) | select('mapping') | list | length)
        == (iac_blueprint.ceph.pools | default([]) | length)
      - >-
        (iac_blueprint.ceph.pools | default([]) | selectattr('name', 'defined') | list | length)
        == (iac_blueprint.ceph.pools | default([]) | length)
      - >-
        (iac_blueprint.ceph.pools | default([]) | map(attribute='name') | unique | list | length)
        == (iac_blueprint.ceph.pools | default([]) | length)
      - >-
        (iac_blueprint.ceph.pools | default([]) | selectattr('name', 'defined')
        | selectattr('name', 'string') | rejectattr('name', 'equalto', '') | list | length)
        == (iac_blueprint.ceph.pools | default([]) | length)
      - >-
        (iac_blueprint.ceph.pools | default([]) | selectattr('pg_num', 'defined')
        | selectattr('pg_num', 'integer') | list | length)
        == (iac_blueprint.ceph.pools | default([]) | selectattr('pg_num', 'defined') | list | length)
      - >-
        (iac_blueprint.ceph.pools | default([]) | selectattr('pg_num', 'defined')
        | selectattr('pg_num', 'integer') | selectattr('pg_num', 'gt', 0) | list | length)
        == (iac_blueprint.ceph.pools | default([]) | selectattr('pg_num', 'defined') | list | length)
    fail_msg: "ceph.pools must contain unique non-empty names and positive integer pg_num values"

- name: "Checking bootstrap host selection before installation"
  ansible.builtin.assert:
    that:
      - inventory_hostname == iac_blueprint.ceph.monitors | first
    fail_msg: "Run install only on the first host in ceph.monitors; it is the designated bootstrap host"
  when: iac_state == "install"

- name: "Checking cluster network before installation"
  ansible.builtin.assert:
    that:
      - iac_blueprint.ceph.cluster_network is defined
      - iac_blueprint.ceph.cluster_network is string
      - iac_blueprint.ceph.cluster_network | length > 0
    fail_msg: "cluster_network must be a non-empty CIDR string for install"
  when: iac_state == "install"
