---
###############################################################################
#
# install.yml
#
# @author Arsi Atomi
#
###############################################################################

- name: "Require cephadm on bootstrap host"
  ansible.builtin.command:
    argv:
      - "cephadm"
      - "version"
  changed_when: false
  check_mode: false

- name: "Require a bootstrap monitor address"
  ansible.builtin.assert:
    that:
      - hostvars[inventory_hostname].ansible_host is defined
    fail_msg: "Set ansible_host to the reachable bootstrap monitor address"

- name: "Bootstrap ceph cluster when not already bootstrapped"
  ansible.builtin.command:
    argv:
      - "cephadm"
      - "bootstrap"
      - "--mon-ip"
      - "{{ hostvars[inventory_hostname].ansible_host }}"
      - "--cluster-network"
      - "{{ iac_blueprint.ceph.cluster_network }}"
    creates: "/etc/ceph/ceph.conf"
  when: iac_blueprint.ceph.cluster_network is defined

- name: "Read registered ceph hosts"
  ansible.builtin.command:
    argv: ["ceph", "orch", "host", "ls", "--format", "json"]
  register: ceph_host_list
  changed_when: false

- name: "Register declared non-bootstrap Ceph hosts"
  ansible.builtin.command:
    argv:
      - "ceph"
      - "orch"
      - "host"
      - "add"
      - "{{ item }}"
      - "{{ hostvars[item].ansible_host | default(item) }}"
  loop: >-
    {{ (iac_blueprint.ceph.monitors
        + (iac_blueprint.ceph.osds | default([]) | map(attribute='host') | list))
       | unique | difference([inventory_hostname]) }}
  changed_when: true
  when: item not in (ceph_host_list.stdout | from_json | map(attribute='hostname') | list)

- name: "Converge monitor daemon placement"
  ansible.builtin.command:
    argv:
      - "ceph"
      - "orch"
      - "apply"
      - "-i"
      - "-"
  stdin: "{{ {'service_type': 'mon', 'placement': {'hosts': iac_blueprint.ceph.monitors}} | to_json }}"

- name: "Converge manager daemon placement"
  ansible.builtin.command:
    argv:
      - "ceph"
      - "orch"
      - "apply"
      - "-i"
      - "-"
  stdin: "{{ {'service_type': 'mgr', 'placement': {'hosts': iac_blueprint.ceph.monitors}} | to_json }}"

- name: "Apply declarative specifications for declared OSD devices"
  ansible.builtin.command:
    argv:
      - "ceph"
      - "orch"
      - "apply"
      - "-i"
      - "-"
    stdin: >-
      {{ {
        'service_type': 'osd',
        'service_id': iac_ceph_osd_service_id,
        'placement': {'hosts': [iac_resource.host]},
        'spec': {'data_devices': {'paths': [iac_resource.device]}}
      } | to_json }}
  loop: "{{ iac_blueprint.ceph.osds | default([]) }}"
  loop_control:
    loop_var: iac_resource
  when:
    - iac_blueprint.ceph.osds | default([]) | length > 0
    - iac_blueprint.ceph.allow_osd_provisioning | default(false)

- name: "Read existing pools"
  ansible.builtin.command:
    argv: ["ceph", "osd", "pool", "ls", "--format", "json"]
  register: ceph_pool_list
  changed_when: false

- name: "Create declared pools"
  ansible.builtin.command:
    argv:
      - "ceph"
      - "osd"
      - "pool"
      - "create"
      - "{{ item.name }}"
      - "{{ item.pg_num | default(32) }}"
  loop: "{{ iac_blueprint.ceph.pools | default([]) }}"
  register: ceph_pool_create
  changed_when: ceph_pool_create.rc == 0
  when: item.name not in (ceph_pool_list.stdout | from_json)
