---
dependency:
  name: shell
  command: "molecule/kvm-ceph/install-collections"

driver:
  name: default
  safe_files:
    - "${MOLECULE_EPHEMERAL_DIRECTORY}/collections/*"
  options:
    managed: true

platforms:
  - name: ceph-a
    install_source: "${IDARSI_TEST_KVM_INSTALL_SOURCE}"
    kickstart: "rocky9-10.ks.tmpl"
    memory_mb: 6144
    vcpus: 2
    disk_size_gb: 30
    install_timeout: 3600
    ssh_user: molecule
    data_disks:
      - { name: "osd1", size_gb: 20 }
  - name: ceph-b
    install_source: "${IDARSI_TEST_KVM_INSTALL_SOURCE}"
    kickstart: "rocky9-10.ks.tmpl"
    memory_mb: 6144
    vcpus: 2
    disk_size_gb: 30
    install_timeout: 3600
    ssh_user: molecule
    data_disks:
      - { name: "osd1", size_gb: 20 }
  - name: ceph-c
    install_source: "${IDARSI_TEST_KVM_INSTALL_SOURCE}"
    kickstart: "rocky9-10.ks.tmpl"
    memory_mb: 6144
    vcpus: 2
    disk_size_gb: 30
    install_timeout: 3600
    ssh_user: molecule
    data_disks:
      - { name: "osd1", size_gb: 20 }

provisioner:
  env:
    IDARSI_MOLECULE_BACKEND: "kvm"
    ANSIBLE_SSH_ARGS: "-F /dev/null -o ControlMaster=no -o ControlPath=none -o ControlPersist=no"
    ANSIBLE_FILTER_PLUGINS: "${MOLECULE_PROJECT_DIRECTORY}/filter_plugins"
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_EPHEMERAL_DIRECTORY}/collections:${ANSIBLE_COLLECTIONS_PATH}"
  name: ansible
  config_options:
    ssh_connection:
      ssh_args: "-F /dev/null -o ControlMaster=no -o ControlPath=none -o ControlPersist=no"
  playbooks:
    create: "${IDARSI_TEST_ENVIRONMENT}/molecule/managed/create.yml"
    destroy: "${IDARSI_TEST_ENVIRONMENT}/molecule/managed/destroy.yml"

verifier:
  name: ansible
