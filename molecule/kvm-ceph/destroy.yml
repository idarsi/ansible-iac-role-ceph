---
- name: Safely remove scenario-owned disks and guests
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    molecule_config: "{{ lookup('file', lookup('env', 'MOLECULE_FILE')) | from_yaml }}"
    suffix: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') | hash('sha256') | truncate(8, true, '') }}"
    test_environment: "{{ lookup('env', 'IDARSI_TEST_ENVIRONMENT') }}"
    kvm_base_dir: "/var/lib/libvirt/images/idarsi-test-bases"
    osd_volume_pool: "{{ lookup('env', 'IDARSI_CEPH_OSD_VOLUME_POOL') | default('idarsi-test-bases', true) }}"
  tasks:
    - name: Validate OSD volume pool name
      ansible.builtin.assert:
        that:
          - osd_volume_pool is string
          - osd_volume_pool | length > 0
          - osd_volume_pool is match('^[A-Za-z0-9_.-]+$')
        fail_msg: "IDARSI_CEPH_OSD_VOLUME_POOL must be a non-empty libvirt pool name containing only letters, digits, underscores, dots, or hyphens."

    - name: Require explicit destruction authorization
      ansible.builtin.assert:
        that:
          - lookup('env', 'IDARSI_CEPH_KVM_DISPOSABLE') == 'YES_I_WILL_DESTROY_THESE_VMS_AND_DISKS'
          - test_environment | length > 0
        fail_msg: "Refusing to remove Ceph scenario VMs/disks without exact destructive-test acknowledgment."

    - name: Validate canonical KVM base directory and reject symlink components
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import os, stat, sys
            path = sys.argv[1]
            current = ''
            for component in path.split('/'):
                if not component:
                    continue
                current += '/' + component
                try:
                    mode = os.lstat(current).st_mode
                except FileNotFoundError:
                    continue
                if stat.S_ISLNK(mode):
                    raise SystemExit(f"Refusing symlink path component: {current}")
            if os.path.realpath(path) != path:
                raise SystemExit(f"KVM base directory is not canonical: {path}")
          - "{{ kvm_base_dir }}"
      changed_when: false

    - name: Require the configured OSD volume pool to be active
      ansible.builtin.shell: |
        set -euo pipefail
        pool_info=$(virsh --connect "$LIBVIRT_URI" pool-info "$OSD_VOLUME_POOL")
        [[ "$pool_info" =~ State:[[:space:]]+running([[:space:]]|$) ]]
      args:
        executable: /bin/bash
      environment:
        LIBVIRT_URI: "{{ molecule_config.driver.libvirt_uri | default('qemu:///system') }}"
        OSD_VOLUME_POOL: "{{ osd_volume_pool }}"
      changed_when: false

    - name: Attempt removal of only the three named OSD volumes and attachments
      ansible.builtin.shell: |
        set -uo pipefail
        errors=()
        error_count=0
        if ! pool_volumes=$(virsh --connect "$LIBVIRT_URI" vol-list --pool "$OSD_VOLUME_POOL" \
          | awk 'NR > 2 { print $1 }'); then
          echo "list volumes in pool $OSD_VOLUME_POOL failed" >&2
          exit 1
        fi
        for vm in ceph-a ceph-b ceph-c; do
          volume="idarsi-ceph-${DISK_SUFFIX}-${vm}-osd.qcow2"
          domain="molecule-${vm}-${DISK_SUFFIX}"
          if ! grep -Fxq -- "$volume" <<<"$pool_volumes"; then
            continue
          fi
          if virsh --connect "$LIBVIRT_URI" dominfo "$domain" >/dev/null 2>&1; then
            for mode in live inactive; do
              selector=()
              detach_mode=--live
              if [[ "$mode" == inactive ]]; then
                selector=(--inactive)
                detach_mode=--config
              fi
              if ! domain_xml=$(virsh --connect "$LIBVIRT_URI" dumpxml "$domain" "${selector[@]}"); then
                errors+=("read domain XML for $domain ($mode) failed")
                error_count=$((error_count + 1))
                continue
              fi
              python3 -c 'import sys, xml.etree.ElementTree as ET; root=ET.fromstring(sys.stdin.read()); matches=[d for d in root.findall("./devices/disk") if d.find("target") is not None and d.find("target").get("dev")=="vdb"]; source=matches[0].find("source") if len(matches)==1 else None; raise SystemExit(0 if not matches else 10 if len(matches)==1 and source is not None and source.get("pool")==sys.argv[1] and source.get("volume")==sys.argv[2] else 11)' "$OSD_VOLUME_POOL" "$volume" <<<"$domain_xml"
              parse_rc=$?
              if ((parse_rc == 10)); then
                if ! virsh --connect "$LIBVIRT_URI" detach-disk "$domain" vdb "$detach_mode"; then
                  errors+=("detach scenario-owned disk from $domain ($detach_mode) failed")
                  error_count=$((error_count + 1))
                fi
              elif ((parse_rc != 0)); then
                errors+=("unexpected or invalid domain XML attachment for $domain ($mode); refusing volume deletion")
                error_count=$((error_count + 1))
              fi
            done
          fi
        done
        if ((error_count > 0)); then
          printf '%s\n' "${errors[@]}" >&2
          exit 1
        fi
      args:
        executable: /bin/bash
      environment:
        DISK_SUFFIX: "{{ suffix }}"
        LIBVIRT_URI: "{{ molecule_config.driver.libvirt_uri | default('qemu:///system') }}"
        OSD_VOLUME_POOL: "{{ osd_volume_pool }}"
      register: disk_cleanup
      failed_when: false
      changed_when: true

    - name: Destroy only the three guests through shared lifecycle helper
      ansible.builtin.command:
        argv:
          - "{{ test_environment }}/scripts/kvm-vm"
          - destroy
          - "{{ item }}"
      environment:
        MOLECULE_EPHEMERAL_DIRECTORY: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}"
        KVM_LIBVIRT_URI: "{{ molecule_config.driver.libvirt_uri | default('qemu:///system') }}"
      loop: ["ceph-a", "ceph-b", "ceph-c"]
      register: destroyed_guests
      failed_when: false
      changed_when: true

    - name: Remove only the three named OSD volumes after successful guest teardown
      ansible.builtin.shell: |
        set -uo pipefail
        errors=()
        error_count=0
        if ! pool_volumes=$(virsh --connect "$LIBVIRT_URI" vol-list --pool "$OSD_VOLUME_POOL" \
          | awk 'NR > 2 { print $1 }'); then
          echo "list volumes in pool $OSD_VOLUME_POOL failed" >&2
          exit 1
        fi
        if ! domains=$(virsh --connect "$LIBVIRT_URI" list --all --name); then
          echo "list libvirt domains failed; refusing volume deletion" >&2
          exit 1
        fi
        for vm in ceph-a ceph-b ceph-c; do
          volume="idarsi-ceph-${DISK_SUFFIX}-${vm}-osd.qcow2"
          if ! grep -Fxq -- "$volume" <<<"$pool_volumes"; then
            continue
          fi
          attached=false
          uncertain=false
          while IFS= read -r domain; do
            [[ -n "$domain" ]] || continue
            for mode in live inactive; do
              selector=()
              [[ "$mode" == inactive ]] && selector=(--inactive)
              if ! domain_xml=$(virsh --connect "$LIBVIRT_URI" dumpxml "$domain" "${selector[@]}"); then
                errors+=("read domain XML for $domain ($mode) failed; refusing to delete $volume")
                error_count=$((error_count + 1))
                uncertain=true
                continue
              fi
              python3 -c 'import sys, xml.etree.ElementTree as ET; root=ET.fromstring(sys.stdin.read()); raise SystemExit(10 if any((s := d.find("source")) is not None and s.get("pool")==sys.argv[1] and s.get("volume")==sys.argv[2] for d in root.findall("./devices/disk")) else 0)' "$OSD_VOLUME_POOL" "$volume" <<<"$domain_xml"
              parse_rc=$?
              if ((parse_rc == 10)); then
                errors+=("volume $volume remains attached to domain $domain ($mode); refusing deletion")
                error_count=$((error_count + 1))
                attached=true
              elif ((parse_rc != 0)); then
                errors+=("invalid domain XML for $domain ($mode); refusing to delete $volume")
                error_count=$((error_count + 1))
                uncertain=true
              fi
            done
          done <<<"$domains"
          if [[ "$attached" == true || "$uncertain" == true ]]; then
            continue
          fi
          if ! virsh --connect "$LIBVIRT_URI" vol-delete "$volume" --pool "$OSD_VOLUME_POOL"; then
            errors+=("delete volume $volume failed")
            error_count=$((error_count + 1))
          fi
        done
        if ((error_count > 0)); then
          printf '%s\n' "${errors[@]}" >&2
          exit 1
        fi
      args:
        executable: /bin/bash
      environment:
        DISK_SUFFIX: "{{ suffix }}"
        LIBVIRT_URI: "{{ molecule_config.driver.libvirt_uri | default('qemu:///system') }}"
        OSD_VOLUME_POOL: "{{ osd_volume_pool }}"
      register: disk_cleanup_retry
      failed_when: false
      changed_when: true
      when:
        - disk_cleanup.rc == 0
        - destroyed_guests.results | selectattr('rc', 'ne', 0) | list | length == 0

    - name: Remove only this scenario's guest OS disks after successful guest teardown
      ansible.builtin.file:
        path: "{{ kvm_base_dir }}/molecule-{{ item }}-{{ suffix }}.qcow2"
        state: absent
      loop: ["ceph-a", "ceph-b", "ceph-c"]
      when: destroyed_guests.results | selectattr('rc', 'ne', 0) | list | length == 0

    - name: Report all guest and disk cleanup failures
      ansible.builtin.assert:
        that:
          - disk_cleanup.rc == 0
          - disk_cleanup_retry.rc | default(0) == 0
          - destroyed_guests.results | selectattr('rc', 'ne', 0) | list | length == 0
        fail_msg: >-
          Cleanup failures: initial disk/attachment cleanup rc={{ disk_cleanup.rc }}
          stderr={{ disk_cleanup.stderr | default('') }};
          retry volume cleanup rc={{ disk_cleanup_retry.rc | default('skipped') }}
          stderr={{ disk_cleanup_retry.stderr | default('') }};
          guest cleanup failures={{ destroyed_guests.results | selectattr('rc', 'ne', 0) | map(attribute='stderr') | list }}

    - name: Remove temporary SSH credentials after successful guest cleanup
      ansible.builtin.file:
        path: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/{{ item }}"
        state: "absent"
      loop: ["kvm_ed25519", "kvm_ed25519.pub"]
      when:
        - disk_cleanup.rc == 0
        - disk_cleanup_retry.rc == 0
        - destroyed_guests.results | selectattr('rc', 'ne', 0) | list | length == 0
