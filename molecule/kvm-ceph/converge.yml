---
- name: Prepare disposable Ceph guests
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for the scenario OSD disk to appear in each guest
      ansible.builtin.shell: |
        set -euo pipefail
        udevadm settle --timeout=30
        expected_serial="idarsi-{{ disk_suffix }}-{{ inventory_hostname | regex_replace('^ceph-', '') }}"
        for attempt in $(seq 1 60); do
          if test -b /dev/vdb && udevadm info --query=property --name=/dev/vdb | grep -Fxq "ID_SERIAL=${expected_serial}"; then
            exit 0
          fi
          sleep 2
        done
        echo "Scenario disk attachment mismatch in guest {{ inventory_hostname }}: /dev/vdb is not the expected scenario-owned disk (serial=${expected_serial})" >&2
        exit 1
      args:
        executable: /bin/bash
      vars:
        disk_suffix: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') | hash('sha256') | truncate(8, true, '') }}"
      changed_when: false

    - name: Set guest hostname to its inventory name
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Set inventory hostname mappings for all Ceph guests
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} MOLECULE CEPH HOSTS"
        block: |-
          {% for guest in groups['all'] | sort %}
          {{ hostvars[guest]['ansible_host'] }} {{ guest }}
          {% endfor %}

- name: Bootstrap and converge disposable Ceph cluster
  hosts: ceph-a
  become: true
  gather_facts: true
  vars:
    state: "install"
    iac_blueprint:
      ceph:
        cluster_name: "ceph"
        monitors: ["ceph-a", "ceph-b", "ceph-c"]
        cluster_network: "192.168.250.0/24"
        ssh_user: "molecule"
        allow_osd_provisioning: true
        osds:
          - { host: "ceph-a", device: "/dev/vdb" }
          - { host: "ceph-b", device: "/dev/vdb" }
          - { host: "ceph-c", device: "/dev/vdb" }
        pools:
          - { name: "molecule-integration", pg_num: 32 }
        filesystems:
          - { name: "molecule-cephfs", mds_count: 2 }
        cephfs_clients:
          - { host: "ceph-a", filesystem: "molecule-cephfs", mountpoint: "/mnt/molecule-cephfs", client_id: "molecule-mount-a" }
          - { host: "ceph-b", filesystem: "molecule-cephfs", mountpoint: "/mnt/molecule-cephfs", client_id: "molecule-mount-b" }
          - { host: "ceph-c", filesystem: "molecule-cephfs", mountpoint: "/mnt/molecule-cephfs", client_id: "molecule-mount-c" }
  tasks:
    - name: Exercise recovery after a controlled late install failure
      block:
        - name: Check scenario interceptor directory is not pre-existing
          ansible.builtin.stat:
            path: /var/tmp/idarsi-ceph-host-add-interceptor
          register: ceph_interceptor_dir

        - name: Require interceptor directory to be scenario-owned
          ansible.builtin.assert:
            that:
              - not ceph_interceptor_dir.stat.exists

        - name: Create scenario-specific interceptor directory
          ansible.builtin.file:
            path: /var/tmp/idarsi-ceph-host-add-interceptor
            state: directory
            mode: "0755"

        - name: Install a scenario-local cephadm host-add interceptor
          ansible.builtin.copy:
            dest: /var/tmp/idarsi-ceph-host-add-interceptor/cephadm
            owner: root
            group: root
            mode: "0755"
            content: |
              #!/bin/bash
              set -euo pipefail
              if [[ "$#" -eq 9 && "$1" == shell && "$2" == -- && "$3" == ceph && "$4" == orch && "$5" == host && "$6" == add ]]; then
                printf '%s\n' "$@" >> /var/tmp/idarsi-cephadm-intercept.log
                exit 73
              fi
              exec /usr/sbin/cephadm "$@"

        - name: Run first valid install and inject failure at host registration
          block:
            - name: Run role install with the scenario-local interceptor first in PATH
              ansible.builtin.include_role:
                name: "{{ playbook_dir }}/../.."
          environment:
            PATH: "/var/tmp/idarsi-ceph-host-add-interceptor:{{ ansible_env.PATH }}"
      rescue:
        - name: Require failure from the injected host-add command
          ansible.builtin.assert:
            that:
              - ansible_failed_result.rc == 73
              - ansible_failed_result.argv == ['cephadm', 'shell', '--', 'ceph', 'orch', 'host', 'add', 'ceph-b', '192.168.250.22']
            fail_msg: "The controlled recovery attempt failed for an unexpected reason."

        - name: Verify bootstrap sentinel, SSH key, and wrapper invocation
          ansible.builtin.shell: |
            set -euo pipefail
            test -s /etc/ceph/ceph.conf
            test -s /etc/ceph/ceph.pub
            test -s /var/tmp/idarsi-cephadm-intercept.log
          args:
            executable: /bin/bash
          changed_when: false

      always:
        - name: Remove scenario-local cephadm wrapper
          ansible.builtin.file:
            path: /var/tmp/idarsi-ceph-host-add-interceptor
            state: absent

    - name: Run identical valid Ceph role install after recovery
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../.."
