              ansible.builtin.shell: |
                set -e
                test ! -e "/home/{{ ceph_missing_user }}/.ssh/authorized_keys"
              changed_when: false
        - name: "Run install with an existing account lacking passwordless sudo"
          block:
            - name: "Assert nobody account exists"
              ansible.builtin.command: "getent passwd nobody"
              register: ceph_nobody_lookup
              changed_when: false
            - name: "Require nobody account lookup to succeed"
              ansible.builtin.assert:
                that:
                  - ceph_nobody_lookup.rc == 0
            - name: "Remove fixture passwordless sudo marker for negative regression"
              ansible.builtin.file:
                path: "/tmp/ceph-mock-state/sudo-allowed"
                state: "absent"
            - name: "Probe missing fixture sudo contract as the SSH account"
              ansible.builtin.command:
                argv: ["/usr/sbin/runuser", "-u", "molecule", "--", "sudo", "-n", "true"]
              register: ceph_missing_sudo_probe
              changed_when: false
              failed_when: false
            - name: "Assert missing fixture sudo contract returns nonzero"
              ansible.builtin.assert:
                that:
                  - ceph_missing_sudo_probe.rc != 0
            - name: "Attempt install without passwordless sudo"
              ansible.builtin.include_role:
                name: ansible-iac-role-ceph
              vars:
                state: "install"
                ceph_bootstrap_sentinel: "/tmp/ceph-mock-state/ceph.conf"
                iac_blueprint:
                  ceph:
                    cluster_name: "ceph"
                    monitors: ["ceph-install-mock", "ceph-b", "ceph-c"]
                    cluster_network: "10.20.0.0/24"
                    ssh_user: "nobody"
            - name: "Fail if missing passwordless sudo is unexpectedly accepted"
              ansible.builtin.fail:
                msg: "The role accepted an SSH account without passwordless sudo."
          rescue:
            - name: "Assert sudo rejection by exact preflight task"
              ansible.builtin.assert:
                that:
                  - ansible_failed_task.name == "Require passwordless sudo for the non-root Ceph SSH user"
          always:
            - name: "Assert sudo rejection preceded all mutation"
              ansible.builtin.shell: |
                set -e
                test ! -e /tmp/ceph-mock-state/ceph.conf
              changed_when: false
            - name: "Assert sudo rejection left log empty"
              ansible.builtin.shell: |
                set -e
                test ! -s /tmp/ceph-mock-state/ceph-mock.log
              changed_when: false
            - name: "Assert sudo rejection did not install an authorized key"
              ansible.builtin.shell: |
                set -e
                test ! -e /nonexistent/.ssh/authorized_keys
              changed_when: false
