---
- name: "Exercise install against CLI stubs"
  hosts: all
  gather_facts: false
  vars:
    ansible_service_mgr: "mock"
    ansible_facts:
      distribution: "Rocky"
      distribution_major_version: "10"
      python:
        version:
          major: 3
          minor: 12
    ceph_mock_log: "/tmp/ceph-mock-state/ceph-mock.log"
    ceph_missing_user: >-
      ceph-missing-{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') | hash('sha1') | truncate(10, true, '') }}
  environment:
    PATH: >-
      /tmp/ceph-mock-state/bin:/usr/local/sbin:/usr/sbin:/usr/local/bin:/usr/bin:/bin
  tasks:
    - name: "Exercise monitor normalization with realistic dump fixtures"
      ansible.builtin.include_tasks: "../../tasks/normalize_monitor_fixture.yml"
      loop:
        - mons:
            - public_addrs:
                addrvec:
                  - { type: "v2", addr: "v2:10.0.0.1:3300", nonce: 0 }
                  - { type: "v1", addr: "v1:10.0.0.1:6789", nonce: 0 }
            - public_addrs:
                addrvec:
                  - { type: "v2", addr: "v2:10.0.0.2:3300", nonce: 0 }
                  - { type: "v1", addr: "v1:10.0.0.2:6789", nonce: 0 }
          expected: ["10.0.0.1:3300", "10.0.0.2:3300"]
          expected_protocol: "v2"
          expected_ms_mode: "prefer-secure"
        - mons:
            - public_addrs:
                addrvec:
                  - { type: "v1", addr: "v1:10.0.0.2:6789/12345", nonce: 12345 }
          expected: ["10.0.0.2:6789"]
          expected_protocol: "v1"
          expected_ms_mode: "legacy"
        - mons:
            - public_addrs:
                addrvec:
                  - { type: "v2", addr: "v2:[2001:db8::1]:3300", nonce: 0 }
          expected: ["[2001:db8::1]:3300"]
          expected_protocol: "v2"
          expected_ms_mode: "prefer-secure"
        - mons:
            - public_addrs:
                addrvec:
                  - { type: "v1", addr: "v1:10.0.0.3:1", nonce: 0 }
          expected: ["10.0.0.3:1"]
          expected_protocol: "v1"
          expected_ms_mode: "legacy"
        - mons:
            - public_addrs:
                addrvec:
                  - { type: "v2", addr: "v2:10.0.0.4:65535", nonce: 0 }
          expected: ["10.0.0.4:65535"]
          expected_protocol: "v2"
          expected_ms_mode: "prefer-secure"
        - mons:
            - public_addrs:
                addrvec:
                  - { type: "v1", addr: "v1:10.0.0.5:6789", nonce: 0 }
            - public_addrs:
                addrvec:
                  - { type: "v2", addr: "v2:10.0.0.6:3300", nonce: 0 }
                  - { type: "v1", addr: "v1:10.0.0.6:6789", nonce: 0 }
          expected: ["10.0.0.6:3300"]
          expected_protocol: "v2"
          expected_ms_mode: "prefer-secure"
      loop_control:
        loop_var: cephfs_fixture
    - name: "Reject invalid normalized monitor endpoint fixtures"
      ansible.builtin.assert:
        that:
          - not (item | ceph_monitor_endpoint)
      loop:
        - "10.0.0.1:0"
        - "256.0.0.1:3300"
        - "999.1.1.1:3300"
        - "[2001:db8::zz]:3300"
        - "[2001:db8::1:3300"
        - "2001:db8::1]:3300"
        - "10.0.0.1:65536"
      loop_control:
        label: "{{ item }}"
    - name: "Reset namespaced mock state"
      ansible.builtin.shell: |
        rm -rf /tmp/ceph-mock-state
        mkdir -p /tmp/ceph-mock-state
        : > /tmp/ceph-mock-state/hosts
        : > /tmp/ceph-mock-state/pools
      changed_when: false
    - name: "Create temporary stub command directory"
      ansible.builtin.file:
        path: "/tmp/ceph-mock-state/bin"
        state: directory
        mode: "0755"
    - name: "Add mock declared peer hosts"
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: "all"
        ansible_connection: containers.podman.podman
        ansible_host: "ceph-install-mock"
      loop: ["ceph-b", "ceph-c"]
    - name: "Generate a random mock SSH password hash on the target"
      ansible.builtin.command:
        argv:
          - "python3"
          - "-c"
          - >-
            import crypt, secrets;
            value = crypt.crypt(secrets.token_urlsafe(32), crypt.mksalt(crypt.METHOD_SHA512));
            assert value and value.startswith('$6$');
            print(value)
      register: ceph_mock_password_hash
      changed_when: false
      no_log: true
      delegate_to: "{{ item }}"
      loop: ["ceph-install-mock", "ceph-b", "ceph-c"]
      run_once: true
    - name: "Create the PAM-valid mock SSH account"
      ansible.builtin.user:
        name: "molecule"
        create_home: true
        password: "{{ item.stdout }}"
        update_password: "always"
      no_log: true
      delegate_to: "{{ item.item }}"
      loop: "{{ ceph_mock_password_hash.results }}"
      run_once: true
    - name: "Install deterministic sudo CLI stub"
      ansible.builtin.copy:
        dest: "/tmp/ceph-mock-state/bin/sudo"
        owner: "root"
        group: "root"
        mode: "0755"
        content: |
          #!/bin/sh
          [ "$#" -eq 2 ] && [ "$1" = "-n" ] && [ "$2" = "true" ] || exit 2
          [ -f /tmp/ceph-mock-state/sudo-allowed ]
      delegate_to: "{{ item }}"
      loop: ["ceph-install-mock", "ceph-b", "ceph-c"]
      run_once: true
    - name: "Enable fixture passwordless sudo contract"
      ansible.builtin.file:
        path: "/tmp/ceph-mock-state/sudo-allowed"
        state: "touch"
        owner: "root"
        mode: "0600"
      delegate_to: "{{ item }}"
      loop: ["ceph-install-mock", "ceph-b", "ceph-c"]
      run_once: true
    - name: "Probe mock passwordless sudo as the SSH account"
      ansible.builtin.command:
        argv: ["/usr/sbin/runuser", "-u", "molecule", "--", "sudo", "-n", "true"]
      changed_when: false
      delegate_to: "{{ item }}"
      loop: ["ceph-install-mock", "ceph-b", "ceph-c"]
      run_once: true
    - name: "Install mock Ceph CLI commands" # noqa: yaml[line-length]
      ansible.builtin.copy:
        dest: "{{ item.path }}"
        mode: "0755"
        content: "{{ item.content }}"
      loop:
        - path: "/tmp/ceph-mock-state/bin/cephadm"
          content: |
            #!/bin/sh
            if [ "${1:-}" = shell ]; then
              shift
              [ "${1:-}" = -- ] || { echo "missing cephadm shell separator" >&2; exit 2; }
              shift
              [ "${1:-}" = ceph ] || { echo "missing ceph command" >&2; exit 2; }
              shift
              printf 'cephadm shell -- ceph %s\n' "$*" >> /tmp/ceph-mock-state/ceph-mock.log
              exec ceph "$@"
            fi
            case "$*" in
              version) printf 'cephadm version 20.2.4\n' ;;
              '--image quay.io/ceph/ceph:v20.2.4 bootstrap --mon-ip ceph-install-mock --cluster-network 10.20.0.0/24 --ssh-user molecule')
                printf 'cephadm %s\n' "$*" >> /tmp/ceph-mock-state/ceph-mock.log
                grep -qxF ceph-install-mock /tmp/ceph-mock-state/hosts || echo ceph-install-mock >> /tmp/ceph-mock-state/hosts
                mkdir -p /tmp/ceph-mock-state
                touch /tmp/ceph-mock-state/ceph.conf
                mkdir -p /etc/ceph
                printf 'ssh-ed25519 AAAATEST ceph\n' > /etc/ceph/ceph.pub
                ;;
              *) echo "unexpected cephadm arguments: $*" >&2; exit 2 ;;
            esac
        - path: "/tmp/ceph-mock-state/bin/ceph"
          content: |
            #!/bin/sh
            # Dispatch on argc and each argv token. The full command is still
            # logged below; using "$*" here would collapse argument boundaries.
            printf 'ceph %s\n' "$*" >> /tmp/ceph-mock-state/ceph-mock.log
            if [ "$#" -eq 5 ] && [ "$1" = orch ] && [ "$2" = host ] && [ "$3" = add ]; then
              [ "$5" = ceph-install-mock ] || { echo "unexpected host-add address: $5" >&2; exit 2; }
              case "$4" in
                ceph-b|ceph-c)
                  printf 'host-add %s %s\n' "$4" "$5" >> /tmp/ceph-mock-state/ceph-mock.log
                  grep -qxF "$4" /tmp/ceph-mock-state/hosts || echo "$4" >> /tmp/ceph-mock-state/hosts
                  exit 0
                  ;;
              esac
            fi
            case "$#:$1:$2:$3:$4:$5:$6:$7:$8" in
              '5:orch:host:ls:--format:json:::')
                [ -f /tmp/ceph-mock-state/hosts ] || : > /tmp/ceph-mock-state/hosts
                printf '['; separator=; while IFS= read -r host; do printf '%s{"hostname":"%s"}' "$separator" "$host"; separator=,; done < /tmp/ceph-mock-state/hosts; printf ']\n' ;;
              '8:orch:device:ls:--hostname:ceph-install-mock:--refresh:--format:json')
                printf 'device-inventory %s\n' "$5" >> /tmp/ceph-mock-state/ceph-mock.log
                count=$(cat /tmp/ceph-mock-state/device-refresh-count 2>/dev/null || echo 0); count=$((count + 1)); echo "$count" > /tmp/ceph-mock-state/device-refresh-count
                if [ "$count" -eq 1 ]; then printf '[]\n'; elif [ -f /tmp/ceph-mock-state/device-duplicate-host ]; then printf '[{"name":"ceph-install-mock","addr":"ceph-install-mock","devices":[{"path":"/dev/sdb","available":true,"rejected_reasons":[]}],"labels":[]},{"name":"ceph-install-mock","addr":"ceph-install-mock","devices":[],"labels":[]}]\n'; elif [ -f /tmp/ceph-mock-state/device-rejected ]; then printf '[{"name":"ceph-install-mock","addr":"ceph-install-mock","devices":[{"path":"/dev/sdb","available":true,"rejected_reasons":[]},{"path":"/dev/sdb","available":false,"rejected_reasons":["Has a FileSystem"]}],"labels":[]}]\n'; elif [ "$count" -gt 2 ] && [ -f /tmp/ceph-mock-state/osd-spec ]; then printf '[{"name":"ceph-install-mock","addr":"ceph-install-mock","devices":[{"path":"/dev/sdb","available":false,"rejected_reasons":["Has a FileSystem"]}],"labels":[]}]\n'; else printf '[{"name":"ceph-install-mock","addr":"ceph-install-mock","devices":[{"path":"/dev/sdb","available":true,"rejected_reasons":[]}],"labels":[]}]\n'; fi ;;
              '3:orch:ls:--export:::::') if [ -f /tmp/ceph-mock-state/export-failure ]; then exit 1; elif [ -f /tmp/ceph-mock-state/export-malformed ]; then printf 'unexpected-scalar\n'; elif [ -f /tmp/ceph-mock-state/export-mismatched-id ]; then printf '%s\n' '---' 'service_type: osd' 'service_id: other-device-service' 'placement:' '  hosts: [ceph-install-mock]' 'spec:' '  data_devices:' '    paths: [/dev/sdb]'; elif [ -f /tmp/ceph-mock-state/export-extra-placement ]; then printf '%s\n' '---' 'service_type: osd' 'service_id: device_9cb199a494bd28d019e3129be0e07cceadb86916ffe7cb9bd334bbe11b6f40f4' 'service_name: osd.device_9cb199a494bd28d019e3129be0e07cceadb86916ffe7cb9bd334bbe11b6f40f4' 'placement:' '  hosts: [ceph-install-mock]' '  host_pattern: ceph-install-mock' 'spec:' '  data_devices:' '    paths: [/dev/sdb]'; elif [ -f /tmp/ceph-mock-state/export-missing-service-id ]; then printf '%s\n' '---' 'service_type: osd' 'placement:' '  hosts: [ceph-install-mock]' 'spec:' '  data_devices:' '    paths: [/dev/sdb]'; elif [ -f /tmp/ceph-mock-state/osd-spec ]; then cat /tmp/ceph-mock-state/osd-spec; else :; fi; if [ -f /tmp/ceph-mock-state/mds-missing-id ]; then printf '%s\n' '---' 'service_type: mds' 'placement:' '  count: 2'; elif [ -f /tmp/ceph-mock-state/mds-unrelated ]; then printf '%s\n' '---' 'service_type: mds' 'service_id: unrelated-fs' 'placement:' '  hosts: [ceph-install-mock]' '---' 'service_type: mds' 'service_id: test-fs' 'placement:' '  count: 2'; elif [ -f /tmp/ceph-mock-state/mds-duplicate ]; then printf '%s\n' '---' 'service_type: mds' 'service_id: test-fs' 'placement:' '  count: 2' '---' 'service_type: mds' 'service_id: test-fs' 'placement:' '  count: 2'; elif [ -f /tmp/ceph-mock-state/mds-invalid-count ]; then printf '%s\n' '---' 'service_type: mds' 'service_id: test-fs' 'placement:' '  count: true'; elif [ -f /tmp/ceph-mock-state/mds-spec ]; then cat /tmp/ceph-mock-state/mds-spec; fi ;;
              '4:orch:apply:-i:-::::') printf 'daemon-apply\n' >> /tmp/ceph-mock-state/ceph-mock.log; spec=$(cat); SPEC="$spec" python3 -c 'import json,os,re,sys; x=json.loads(os.environ["SPEC"]); common={"placement":{"hosts":["ceph-install-mock","ceph-b","ceph-c"]}}; kind=x.get("service_type"); valid=(kind in ("mon","mgr") and x==dict(common,service_type=kind)) or (kind=="mds" and x=={"service_type":"mds","service_id":"test-fs","placement":{"count":2}}) or (kind=="osd" and re.fullmatch(r"device_[0-9a-f]{64}",x.get("service_id","")) and x=={"service_type":"osd","service_id":x["service_id"],"placement":{"hosts":["ceph-install-mock"]},"spec":{"data_devices":{"paths":["/dev/sdb"]}}}); sys.exit(0 if valid else 2)' || { echo "unexpected service spec: $spec" >&2; exit 2; }; compact=$(printf '%s' "$spec" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin),separators=(",",":")))'); printf 'spec %s\n' "$compact" >> /tmp/ceph-mock-state/ceph-mock.log; case "$compact" in *'"service_type":"mds"'*) echo 0 > /tmp/ceph-mock-state/mds-stat-count ;; esac; SPEC="$compact" python3 -c 'import json,os; x=json.loads(os.environ["SPEC"]); print("---\n"+json.dumps(dict(x,service_name="osd."+x["service_id"],spec=dict(x["spec"],objectstore="bluestore",filter_logic="AND"))) if x["service_type"]=="osd" else "")' > /tmp/ceph-mock-state/new-osd-spec; if grep -q '"service_type":"osd"' /tmp/ceph-mock-state/new-osd-spec; then cp /tmp/ceph-mock-state/new-osd-spec /tmp/ceph-mock-state/osd-spec; fi; if printf '%s' "$compact" | grep -q '"service_type":"mds"'; then printf '%s\n' '---' "$compact" > /tmp/ceph-mock-state/mds-spec; fi ;;
              '5:fs:volume:ls:--format:json:::') if [ -f /tmp/ceph-mock-state/filesystems ]; then printf '[{"name":"test-fs"}]\n'; else printf '[]\n'; fi ;;
              '4:fs:volume:create:test-fs::::') echo "volume-create $*" >> /tmp/ceph-mock-state/ceph-mock.log; touch /tmp/ceph-mock-state/filesystems ;;
              '2:mds:stat::::::') count=$(cat /tmp/ceph-mock-state/mds-stat-count 2>/dev/null || echo 0); count=$((count + 1)); echo "$count" > /tmp/ceph-mock-state/mds-stat-count; printf 'ceph mds stat poll %s\n' "$count" >> /tmp/ceph-mock-state/ceph-mock.log; if [ "$count" -eq 1 ]; then printf 'other-fs:1 {0=mds.other.a=up:active}, test-fs:1 {0=mds.test-fs.a=up:creating}\n'; else printf 'other-fs:1 {0=mds.other.a=up:active}, test-fs:1 {0=mds.test-fs.a=up:active}\n'; fi ;;
              '4:mon:dump:--format:json::::') printf '{"mons":[{"public_addrs":{"addrvec":[{"type":"v2","addr":"10.0.0.1:3300","nonce":0},{"type":"v1","addr":"10.0.0.1:6789","nonce":0}]}}]}\n' ;;
              '5:osd:pool:ls:--format:json:::') [ -f /tmp/ceph-mock-state/pools ] || : > /tmp/ceph-mock-state/pools; awk 'BEGIN {printf "["} {printf "%s\"%s\"", sep, $0; sep=","} END {print "]"}' /tmp/ceph-mock-state/pools ;;
              '7:osd:pool:get:test-pool:pg_num:--format:json:') printf 'pool-preflight\n' >> /tmp/ceph-mock-state/ceph-mock.log; if [ -f /tmp/ceph-mock-state/pool-conflict ]; then printf '{"pool":"test-pool","pool_id":1,"pg_num":8}\n'; else printf '{"pool":"test-pool","pool_id":1,"pg_num":16}\n'; fi ;;
              '5:osd:pool:create:test-pool:16:::') grep -qxF test-pool /tmp/ceph-mock-state/pools || echo test-pool >> /tmp/ceph-mock-state/pools ;;
              *) echo "unexpected ceph arguments (argc=$#): $*" >&2; exit 2 ;;
            esac
    - name: "Check pre-existing authorized keys on install target"
      ansible.builtin.stat:
        path: "/home/molecule/.ssh/authorized_keys"
      delegate_to: "ceph-install-mock"
      register: ceph_preexisting_authorized_keys
    - name: "Require install target authorized keys to be absent"
      ansible.builtin.assert:
        that:
          - not ceph_preexisting_authorized_keys.stat.exists
        fail_msg: >-
          Refusing to run mock install with pre-existing authorized keys.
    - name: "Create CephFS mountpoint symlink target"
      ansible.builtin.file:
        path: "/tmp/ceph-mock-state/outside"
        state: "directory"
        mode: "0755"
      delegate_to: "ceph-install-mock"
    - name: "Create CephFS mountpoint symlink fixture"
      ansible.builtin.file:
        src: "/tmp/ceph-mock-state/outside"
        dest: "/mnt/cephfs-guard"
        state: "link"
      delegate_to: "ceph-install-mock"
    - name: "Require symlink mountpoint rejection before any install mutation"
      block:
        - name: "Attempt install with symlinked CephFS mountpoint"
          ansible.builtin.include_role:
            name: ansible-iac-role-ceph
          vars:
            state: "install"
            ceph_bootstrap_sentinel: "/tmp/ceph-mock-state/ceph.conf"
            iac_blueprint:
              ceph:
                cluster_name: "ceph"
                monitors: ["ceph-install-mock", "ceph-b", "ceph-c"]
                cluster_network: "10.20.0.0/24"
                filesystems: [{ name: "test-fs", mds_count: 2 }]
                cephfs_clients:
                  - host: "ceph-install-mock"
                    filesystem: "test-fs"
                    mountpoint: "/mnt/cephfs-guard"
                    client_id: "guard"
        - name: "Fail if symlinked mountpoint is accepted"
          ansible.builtin.fail:
            msg: "The role accepted a symlinked CephFS mountpoint."
      rescue:
        - name: "Assert symlink guard is the failure"
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == "Resolve CephFS client mountpoints before mutation"
      always:
        - name: "Assert symlink guard precedes bootstrap and Ceph mutations"
          ansible.builtin.shell: |
            set -e
            test ! -e /tmp/ceph-mock-state/ceph.conf
            test ! -s /tmp/ceph-mock-state/ceph-mock.log
          changed_when: false
    - name: "Remove CephFS mountpoint symlink fixture"
      ansible.builtin.file:
        path: "/mnt/cephfs-guard"
        state: "absent"
      delegate_to: "ceph-install-mock"
    - name: "Apply install twice"
      ansible.builtin.include_role:
        name: ansible-iac-role-ceph
      vars:
        state: "install"
        ceph_bootstrap_sentinel: "/tmp/ceph-mock-state/ceph.conf"
        iac_blueprint:
          ceph:
            cluster_name: "ceph"
            monitors: ["ceph-install-mock", "ceph-b", "ceph-c"]
            cluster_network: "10.20.0.0/24"
            ssh_user: "molecule"
            allow_osd_provisioning: true
            osds: [{ host: "ceph-install-mock", device: "/dev/sdb" }]
            pools: [{ name: "test-pool", pg_num: 16 }]
            filesystems: [{ name: "test-fs", mds_count: 2 }]
      loop: [1, 2]
      loop_control:
        loop_var: install_pass
    - name: "Require install to declare SSH key distribution targets"
      ansible.builtin.assert:
        that:
          - iac_ceph_ssh_key_distribution_targets is defined
        fail_msg: >-
          The install role did not set
          iac_ceph_ssh_key_distribution_targets; cannot verify SSH key
          distribution scope.
    - name: "Save declared SSH key distribution targets for verification"
      ansible.builtin.copy:
        content: "{{ iac_ceph_ssh_key_distribution_targets | to_json }}\n"
        dest: "/tmp/ceph-mock-state/key-targets.json"
        mode: "0644"
    - name: "Save normal install command log"
      ansible.builtin.copy:
        src: "{{ ceph_mock_log }}"
        dest: "/tmp/ceph-mock-state/install.log"
        remote_src: true
        mode: "0644"
    - name: "Read normal install mock log"
      ansible.builtin.command: "cat /tmp/ceph-mock-state/install.log"
      register: install_mock_log
      changed_when: false
    - name: "Verify CephFS create and MDS command/spec contract and repeat idempotence"
      ansible.builtin.assert:
        that:
          - install_mock_log.stdout_lines | select('equalto', 'cephadm shell -- ceph fs volume create test-fs') | list | length == 1
          - install_mock_log.stdout_lines | select('search', '"service_type":"mds","service_id":"test-fs","placement":{"count":2}') | list | length == 1
          - install_mock_log.stdout_lines | select('search', '"service_type":"mds"') | list | length == 1
          - install_mock_log.stdout_lines | select('match', '^ceph mds stat poll 1$') | list | length == 1
          - install_mock_log.stdout_lines | select('match', '^ceph mds stat poll 2$') | list | length == 1
          - install_mock_log.stdout_lines | select('match', '^ceph mds stat poll 3$') | list | length == 1
          - install_mock_log.stdout_lines | select('match', '^ceph mds stat poll ') | list | length == 3
          - install_mock_log.stdout is not search('ceph mon dump')
          - >-
            ('other-fs:1 {0=mds.other.a=up:active}, test-fs:1 {0=mds.test-fs.a=up:creating}'
            | ceph_mds_is_active('test-fs')) == false
          - >-
            ('other-fs:1 {0=mds.other.a=up:active}, test-fs:1 {0=mds.test-fs.a=up:active}'
            | ceph_mds_is_active('test-fs')) == true
          - >-
            ('fsXname:1 {0=mds.fsXname.a=up:active}, fs.name:1 {0=mds.fs.name.a=up:creating}'
            | ceph_mds_is_active('fs.name')) == false
          - >-
            ('fsXname:1 {0=mds.fsXname.a=up:active}, fs.name:1 {0=mds.fs.name.a=up:active}'
            | ceph_mds_is_active('fs.name')) == true
          - >-
            ('target-longer:1 {0=mds.target-longer.a=up:active}'
            | ceph_mds_is_active('target')) == false
    - name: "Reset log and readiness state for matching MDS-only export scenario"
      ansible.builtin.shell: |
        : > {{ ceph_mock_log }}
        echo 0 > /tmp/ceph-mock-state/mds-stat-count
      changed_when: false
    - name: "Run MDS-only install with an existing matching MDS specification"
      ansible.builtin.include_role:
        name: ansible-iac-role-ceph
      vars:
        state: "install"
        ceph_bootstrap_sentinel: "/tmp/ceph-mock-state/ceph.conf"
        iac_blueprint:
          ceph:
            cluster_name: "ceph"
            monitors: ["ceph-install-mock", "ceph-b", "ceph-c"]
            cluster_network: "10.20.0.0/24"
            filesystems: [{ name: "test-fs", mds_count: 2 }]
    - name: "Read matching MDS-only install log"
      ansible.builtin.command: "cat {{ ceph_mock_log }}"
      register: matching_mds_only_log
      changed_when: false
    - name: "Assert matching MDS-only export is skipped without OSDs or pools"
      ansible.builtin.assert:
        that:
