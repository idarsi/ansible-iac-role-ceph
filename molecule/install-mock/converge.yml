---
- name: "Exercise install against CLI stubs"
  hosts: all
  gather_facts: false
  vars:
    ansible_service_mgr: "mock"
    ansible_facts:
      distribution: "Rocky"
      distribution_major_version: "9"
    ceph_mock_log: "/tmp/ceph-mock-state/ceph-mock.log"
    ceph_missing_user: >-
      ceph-missing-{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') | hash('sha1') | truncate(10, true, '') }}
  environment:
    PATH: "/tmp/ceph-mock-state/bin:/usr/local/bin:/usr/bin:/bin"
  tasks:
    - name: "Reset namespaced mock state"
      ansible.builtin.shell: |
        rm -rf /tmp/ceph-mock-state
        mkdir -p /tmp/ceph-mock-state
        : > /tmp/ceph-mock-state/hosts
        : > /tmp/ceph-mock-state/pools
      changed_when: false
    - name: "Create temporary stub command directory"
      ansible.builtin.file:
        path: "/tmp/ceph-mock-state/bin"
        state: directory
        mode: "0755"
    - name: "Prepare the pre-existing mock SSH account"
      ansible.builtin.shell: |
        dnf -y install sudo >/dev/null
        id molecule >/dev/null 2>&1 || useradd --create-home molecule
        printf 'molecule ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/molecule
        chmod 0440 /etc/sudoers.d/molecule
      changed_when: false
    - name: "Add mock declared peer hosts"
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: "all"
        ansible_connection: containers.podman.podman
        ansible_host: "ceph-install-mock"
      loop: ["ceph-b", "ceph-c"]
    - name: "Install mock Ceph CLI commands" # noqa: yaml[line-length]
      ansible.builtin.copy:
        dest: "{{ item.path }}"
        mode: "0755"
        content: "{{ item.content }}"
      loop:
        - path: "/tmp/ceph-mock-state/bin/cephadm"
          content: |
            #!/bin/sh
            if [ "${1:-}" = shell ]; then
              shift
              [ "${1:-}" = -- ] || { echo "missing cephadm shell separator" >&2; exit 2; }
              shift
              [ "${1:-}" = ceph ] || { echo "missing ceph command" >&2; exit 2; }
              shift
              printf 'cephadm shell -- ceph %s\n' "$*" >> /tmp/ceph-mock-state/ceph-mock.log
              exec ceph "$@"
            fi
            case "$*" in
              version) printf 'cephadm version 20.2.4\n' ;;
              '--image quay.io/ceph/ceph:v20.2.4 bootstrap --mon-ip ceph-install-mock --cluster-network 10.20.0.0/24 --ssh-user molecule')
                printf 'cephadm %s\n' "$*" >> /tmp/ceph-mock-state/ceph-mock.log
                grep -qxF ceph-install-mock /tmp/ceph-mock-state/hosts || echo ceph-install-mock >> /tmp/ceph-mock-state/hosts
                mkdir -p /tmp/ceph-mock-state
                touch /tmp/ceph-mock-state/ceph.conf
                mkdir -p /etc/ceph
                printf 'ssh-ed25519 AAAATEST ceph\n' > /etc/ceph/ceph.pub
                ;;
              *) echo "unexpected cephadm arguments: $*" >&2; exit 2 ;;
            esac
        - path: "/tmp/ceph-mock-state/bin/ceph"
          content: |
            #!/bin/sh
            # Dispatch on argc and each argv token. The full command is still
            # logged below; using "$*" here would collapse argument boundaries.
            printf 'ceph %s\n' "$*" >> /tmp/ceph-mock-state/ceph-mock.log
            case "$#:$1:$2:$3:$4:$5:$6:$7" in
              '5:orch:host:ls:--format:json::')
                [ -f /tmp/ceph-mock-state/hosts ] || : > /tmp/ceph-mock-state/hosts
                printf '['; separator=; while IFS= read -r host; do printf '%s{"hostname":"%s"}' "$separator" "$host"; separator=,; done < /tmp/ceph-mock-state/hosts; printf ']\n' ;;
              '5:orch:device:ls:--format:json::')
                printf 'device-inventory\n' >> /tmp/ceph-mock-state/ceph-mock.log
                if [ -f /tmp/ceph-mock-state/device-rejected ]; then printf '[{"hostname":"ceph-install-mock","path":"/dev/sdb","available":true,"rejected_reasons":[]},{"hostname":"ceph-install-mock","path":"/dev/sdb","available":false,"rejected_reasons":["Has a FileSystem"]}]\n'; else printf '[{"hostname":"ceph-install-mock","path":"/dev/sdb","available":true,"rejected_reasons":[]}]\n'; fi ;;
              '5:orch:host:add:ceph-b:ceph-b::') printf 'host-add ceph-b\n' >> /tmp/ceph-mock-state/ceph-mock.log; grep -qxF ceph-b /tmp/ceph-mock-state/hosts || echo ceph-b >> /tmp/ceph-mock-state/hosts ;;
              '5:orch:host:add:ceph-c:ceph-c::') printf 'host-add ceph-c\n' >> /tmp/ceph-mock-state/ceph-mock.log; grep -qxF ceph-c /tmp/ceph-mock-state/hosts || echo ceph-c >> /tmp/ceph-mock-state/hosts ;;
              '4:orch:apply:-i:-:::') printf 'daemon-apply\n' >> /tmp/ceph-mock-state/ceph-mock.log; spec=$(cat); SPEC="$spec" python3 -c 'import json,os,re,sys; x=json.loads(os.environ["SPEC"]); common={"placement":{"hosts":["ceph-install-mock","ceph-b","ceph-c"]}}; kind=x.get("service_type"); valid=(kind in ("mon","mgr") and x==dict(common,service_type=kind)) or (kind=="osd" and re.fullmatch(r"device_[0-9a-f]{64}",x.get("service_id","")) and x=={"service_type":"osd","service_id":x["service_id"],"placement":{"hosts":["ceph-install-mock"]},"spec":{"data_devices":{"paths":["/dev/sdb"]}}}); sys.exit(0 if valid else 2)' || { echo "unexpected service spec: $spec" >&2; exit 2; }; compact=$(printf '%s' "$spec" | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin),separators=(",",":")))'); printf 'spec %s\n' "$compact" >> /tmp/ceph-mock-state/ceph-mock.log ;;
              '5:osd:pool:ls:--format:json::') [ -f /tmp/ceph-mock-state/pools ] || : > /tmp/ceph-mock-state/pools; awk 'BEGIN {printf "["} {printf "%s\"%s\"", sep, $0; sep=","} END {print "]"}' /tmp/ceph-mock-state/pools ;;
              '7:osd:pool:get:test-pool:pg_num:--format:json') printf 'pool-preflight\n' >> /tmp/ceph-mock-state/ceph-mock.log; if [ -f /tmp/ceph-mock-state/pool-conflict ]; then printf '{"pool":"test-pool","pool_id":1,"pg_num":8}\n'; else printf '{"pool":"test-pool","pool_id":1,"pg_num":16}\n'; fi ;;
              '5:osd:pool:create:test-pool:16::') grep -qxF test-pool /tmp/ceph-mock-state/pools || echo test-pool >> /tmp/ceph-mock-state/pools ;;
              *) echo "unexpected ceph arguments (argc=$#): $*" >&2; exit 2 ;;
            esac
    - name: "Apply install twice"
      ansible.builtin.include_role:
        name: ansible-iac-role-ceph
      vars:
        state: "install"
        ceph_bootstrap_sentinel: "/tmp/ceph-mock-state/ceph.conf"
        iac_blueprint:
          ceph:
            cluster_name: "ceph"
            monitors: ["ceph-install-mock", "ceph-b", "ceph-c"]
            cluster_network: "10.20.0.0/24"
            ssh_user: "molecule"
            allow_osd_provisioning: true
            osds: [{ host: "ceph-install-mock", device: "/dev/sdb" }]
            pools: [{ name: "test-pool", pg_num: 16 }]
      loop: [1, 2]
      loop_control:
        loop_var: install_pass
    - name: "Save normal install command log"
      ansible.builtin.copy:
        src: "{{ ceph_mock_log }}"
        dest: "/tmp/ceph-mock-state/install.log"
        remote_src: true
        mode: "0644"
    - name: "Switch device inventory to rejected state"
      ansible.builtin.file:
        path: "/tmp/ceph-mock-state/device-rejected"
        state: touch
        mode: "0644"
    - name: "Mark existing pool as conflicting"
      ansible.builtin.file:
        path: "/tmp/ceph-mock-state/pool-conflict"
        state: touch
        mode: "0644"
    - name: "Reset mock log before conflict check"
      ansible.builtin.command: "truncate -s 0 {{ ceph_mock_log }}"
      changed_when: false
    - name: "Require pool conflict to fail before daemon mutation"
      block:
        - name: "Attempt install with conflicting existing pool"
          ansible.builtin.include_role:
            name: ansible-iac-role-ceph
          vars:
            state: "install"
            ceph_bootstrap_sentinel: "/tmp/ceph-mock-state/ceph.conf"
            iac_blueprint:
              ceph:
                cluster_name: "ceph"
                monitors: ["ceph-install-mock", "ceph-b", "ceph-c"]
                cluster_network: "10.20.0.0/24"
                pools: [{ name: "test-pool", pg_num: 16 }]
      rescue:
        - name: "Assert pool conflict is reported"
          ansible.builtin.assert:
            that:
              - "'Existing pool test-pool' in (ansible_failed_result | string)"
    - name: "Require rejected OSD device preflight to stop provisioning"
      block:
        - name: "Clear pool conflict for device inventory check"
          ansible.builtin.file:
            path: "/tmp/ceph-mock-state/pool-conflict"
            state: absent
        - name: "Reset mock log before rejected-device check"
          ansible.builtin.command: "truncate -s 0 {{ ceph_mock_log }}"
          changed_when: false
        - name: "Attempt install with unavailable OSD device"
          ansible.builtin.include_role:
            name: ansible-iac-role-ceph
          vars:
            state: "install"
            ceph_bootstrap_sentinel: "/tmp/ceph-mock-state/ceph.conf"
            iac_blueprint:
              ceph:
                cluster_name: "ceph"
                monitors: ["ceph-install-mock", "ceph-b", "ceph-c"]
                cluster_network: "10.20.0.0/24"
                allow_osd_provisioning: true
                osds: [{ host: "ceph-install-mock", device: "/dev/sdb" }]
                pools: [{ name: "test-pool", pg_num: 16 }]
      rescue:
        - name: "Assert rejected device failure is explicit"
          ansible.builtin.assert:
            that:
              - "'Refusing OSD provisioning' in (ansible_failed_result | string)"
    - name: "Assert pool conflict occurred before daemon apply"
      ansible.builtin.command: "cat {{ ceph_mock_log }}"
      register: conflict_log
      changed_when: false
    - name: "Check pool conflict log ordering"
      ansible.builtin.assert:
        that:
          - "'pool-preflight' in conflict_log.stdout_lines"
          - "'daemon-apply' not in conflict_log.stdout_lines"
          - "'host-add ceph-b' not in conflict_log.stdout_lines"
          - "'host-add ceph-c' not in conflict_log.stdout_lines"
    - name: "Assert rejected-device check applied no daemon or OSD specs"
      ansible.builtin.command: "cat {{ ceph_mock_log }}"
      register: rejected_device_log
      changed_when: false
    - name: "Check rejected-device log contains no spec applies"
      ansible.builtin.assert:
        that:
          - "'device-inventory' in rejected_device_log.stdout_lines"
          - "'daemon-apply' not in rejected_device_log.stdout_lines"
          - "rejected_device_log.stdout_lines | select('match', '^spec .*\"service_type\":\"osd\"') | list | length == 0"
    - name: "Exercise SSH prerequisite rejection before mutation"
      block:
        - name: "Remove install sentinel and clear mock activity log"
          ansible.builtin.shell: |
            rm -f /tmp/ceph-mock-state/ceph.conf
            : > /tmp/ceph-mock-state/ceph-mock.log
          changed_when: false
        - name: "Run install with a missing SSH account"
          block:
            - name: "Assert synthetic missing account is absent"
              ansible.builtin.command: "getent passwd {{ ceph_missing_user }}"
              register: ceph_missing_user_lookup
              changed_when: false
              failed_when: false
            - name: "Require synthetic missing account to be absent"
              ansible.builtin.assert:
                that:
                  - ceph_missing_user_lookup.rc == 2
            - name: "Attempt install with missing SSH account"
              ansible.builtin.include_role:
                name: ansible-iac-role-ceph
              vars:
                state: "install"
                ceph_bootstrap_sentinel: "/tmp/ceph-mock-state/ceph.conf"
                iac_blueprint:
                  ceph:
                    cluster_name: "ceph"
                    monitors: ["ceph-install-mock"]
                    cluster_network: "10.20.0.0/24"
                    ssh_user: "{{ ceph_missing_user }}"
            - name: "Fail if missing account is unexpectedly accepted"
              ansible.builtin.fail:
                msg: "The role accepted a missing Ceph SSH account."
          rescue:
            - name: "Assert missing account rejected by exact preflight task and message"
              ansible.builtin.assert:
                that:
                  - ansible_failed_task.name == "Require existing non-root Ceph accounts"
                  - >-
                    ansible_failed_result.msg == "Ceph SSH user '{{ ceph_missing_user }}' must already exist on declared host 'ceph-install-mock'; this role will not create accounts."
          always:
            - name: "Assert missing-account rejection preceded all mutation"
              ansible.builtin.shell: |
                set -e
                test ! -e /tmp/ceph-mock-state/ceph.conf
              changed_when: false
            - name: "Assert missing-account rejection left log empty"
              ansible.builtin.shell: |
                set -e
                test ! -s /tmp/ceph-mock-state/ceph-mock.log
              changed_when: false
            - name: "Assert missing-account rejection did not install an authorized key"
              ansible.builtin.shell: |
                set -e
                test ! -e "/home/{{ ceph_missing_user }}/.ssh/authorized_keys"
              changed_when: false
        - name: "Run install with an existing account lacking passwordless sudo"
          block:
            - name: "Assert nobody account exists"
              ansible.builtin.command: "getent passwd nobody"
              register: ceph_nobody_lookup
              changed_when: false
            - name: "Require nobody account lookup to succeed"
              ansible.builtin.assert:
                that:
                  - ceph_nobody_lookup.rc == 0
            - name: "Attempt install without passwordless sudo"
              ansible.builtin.include_role:
                name: ansible-iac-role-ceph
              vars:
                state: "install"
                ceph_bootstrap_sentinel: "/tmp/ceph-mock-state/ceph.conf"
                iac_blueprint:
                  ceph:
                    cluster_name: "ceph"
                    monitors: ["ceph-install-mock"]
                    cluster_network: "10.20.0.0/24"
                    ssh_user: "nobody"
            - name: "Fail if missing passwordless sudo is unexpectedly accepted"
              ansible.builtin.fail:
                msg: "The role accepted an SSH account without passwordless sudo."
          rescue:
            - name: "Assert sudo rejection by exact preflight task and message"
              ansible.builtin.assert:
                that:
                  - ansible_failed_task.name == "Require passwordless sudo for the non-root Ceph SSH user"
                  - >-
                    ansible_failed_result.msg == "Ceph SSH user 'nobody' must have passwordless sudo on declared host 'ceph-install-mock'."
          always:
            - name: "Assert sudo rejection preceded all mutation"
              ansible.builtin.shell: |
                set -e
                test ! -e /tmp/ceph-mock-state/ceph.conf
              changed_when: false
            - name: "Assert sudo rejection left log empty"
              ansible.builtin.shell: |
                set -e
                test ! -s /tmp/ceph-mock-state/ceph-mock.log
              changed_when: false
            - name: "Assert sudo rejection did not install an authorized key"
              ansible.builtin.shell: |
                set -e
                test ! -e /nonexistent/.ssh/authorized_keys
              changed_when: false
