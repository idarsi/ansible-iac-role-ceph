---
driver:
  name: podman
platforms:
  - name: ceph-install-mock
    image: "rockylinux:10"
    registry:
      url: "quay.io/rockylinux"
    privileged: false
    command: "sleep infinity"
    pre_build_image: false
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  inventory:
    host_vars:
      ceph-install-mock:
        ansible_connection: containers.podman.podman
        ansible_facts:
          distribution: Rocky
          distribution_major_version: "10"
          python:
            version:
              major: 3
              minor: 12
        ansible_host: "ceph-install-mock"
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - converge
    - verify
    - destroy
