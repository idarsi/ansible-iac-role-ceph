---
driver:
  name: podman
platforms:
  - name: ceph-install-mock
    image: "quay.io/rockylinux/rockylinux:9"
    privileged: false
    command: "sleep infinity"
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  inventory:
    host_vars:
      ceph-install-mock:
        ansible_connection: containers.podman.podman
        ansible_facts:
          distribution: Rocky
          distribution_major_version: "9"
        ansible_host: "ceph-install-mock"
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - converge
    - verify
    - destroy
