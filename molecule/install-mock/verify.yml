---
- name: "Verify mocked install commands"
  hosts: all
  gather_facts: false
  tasks:
    - name: "Read stub command log"
      ansible.builtin.command: "cat /tmp/ceph-mock-state/install.log"
      register: ceph_mock_log
      changed_when: false
    - name: "Assert exact bootstrap command and submitted service specs" # noqa: yaml[line-length]
      ansible.builtin.assert:
        that:
          - ceph_mock_log.stdout_lines | select('equalto', 'cephadm --image quay.io/ceph/ceph:v20.2.4 bootstrap --mon-ip ceph-install-mock --cluster-network 10.20.0.0/24 --ssh-user molecule') | list | length == 1
          - ceph_mock_log.stdout_lines | select('equalto', 'cephadm shell -- ceph osd pool ls --format json') | list | length == 2
          - ceph_mock_log.stdout_lines | select('equalto', 'cephadm shell -- ceph osd pool get test-pool pg_num --format json') | list | length == 1
          - ceph_mock_log.stdout_lines | select('equalto', 'cephadm shell -- ceph orch host add ceph-b ceph-install-mock') | list | length == 1
          - ceph_mock_log.stdout_lines | select('equalto', 'cephadm shell -- ceph orch host add ceph-c ceph-install-mock') | list | length == 1
          - ceph_mock_log.stdout_lines | select('equalto', 'cephadm shell -- ceph orch host ls --format json') | list | length == 8
          - ceph_mock_log.stdout_lines | select('match', '^device-inventory ceph-install-mock$') | list | length == 3
          - ceph_mock_log.stdout_lines | select('equalto', 'cephadm shell -- ceph orch apply -i -') | list | length == 6
          - ceph_mock_log.stdout_lines | select('equalto', 'spec {"service_type":"mon","placement":{"hosts":["ceph-install-mock","ceph-b","ceph-c"]}}') | list | length == 2
          - ceph_mock_log.stdout_lines | select('equalto', 'spec {"service_type":"mgr","placement":{"hosts":["ceph-install-mock","ceph-b","ceph-c"]}}') | list | length == 2
          - ceph_mock_log.stdout_lines | select('match', '^spec \{"service_type":"osd","service_id":"device_[0-9a-f]{64}","placement":\{"hosts":\["ceph-install-mock"\]\},"spec":\{"data_devices":\{"paths":\["/dev/sdb"\]\}\}\}$') | list | length == 2
          - ceph_mock_log.stdout_lines | select('equalto', 'cephadm shell -- ceph osd pool create test-pool 16') | list | length == 1
          - ceph_mock_log.stdout_lines | select('equalto', 'host-add ceph-b ceph-install-mock') | list | length == 1
          - ceph_mock_log.stdout_lines | select('equalto', 'host-add ceph-c ceph-install-mock') | list | length == 1
    - name: "Read installed authorized key for declared peer user"
      ansible.builtin.slurp:
        src: "/home/molecule/.ssh/authorized_keys"
      delegate_to: "ceph-install-mock"
      register: ceph_authorized_keys
    - name: "Assert only the expected public key was installed"
      ansible.builtin.assert:
        that:
          - "(ceph_authorized_keys.content | b64decode) == 'ssh-ed25519 AAAATEST ceph\n'"
    - name: "Read declared SSH key distribution targets"
      ansible.builtin.slurp:
        src: "/tmp/ceph-mock-state/key-targets.json"
      register: ceph_key_targets_artifact
    - name: "Assert public key was distributed only to declared peers"
      ansible.builtin.assert:
        that:
          - (ceph_key_targets_artifact.content | b64decode | from_json) == ['ceph-install-mock', 'ceph-b', 'ceph-c']
    - name: "Read final mocked host registration state"
      ansible.builtin.command: "cat /tmp/ceph-mock-state/hosts"
      register: ceph_mock_hosts
      changed_when: false
    - name: "Assert expected host registration converged exactly"
      ansible.builtin.assert:
        that:
          - ceph_mock_hosts.stdout_lines | sort == ['ceph-b', 'ceph-c', 'ceph-install-mock']
