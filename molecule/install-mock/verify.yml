---
- name: "Verify mocked install commands"
  hosts: all
  gather_facts: false
  tasks:
    - name: "Read stub command log"
      ansible.builtin.command: "cat /tmp/ceph-mock-state/install.log"
      register: ceph_mock_log
      changed_when: false
    - name: "Assert exact bootstrap command and submitted service specs" # noqa: yaml[line-length]
      ansible.builtin.assert:
        that:
          - ceph_mock_log.stdout_lines | select('equalto', 'cephadm --image quay.io/ceph/ceph:v20.2.4 bootstrap --mon-ip ceph-install-mock --cluster-network 10.20.0.0/24') | list | length == 1
          - ceph_mock_log.stdout_lines | select('equalto', 'spec {"service_type":"mon","placement":{"hosts":["ceph-install-mock","ceph-b","ceph-c"]}}') | list | length == 2
          - ceph_mock_log.stdout_lines | select('equalto', 'spec {"service_type":"mgr","placement":{"hosts":["ceph-install-mock","ceph-b","ceph-c"]}}') | list | length == 2
          - ceph_mock_log.stdout_lines | select('match', '^spec \{"service_type":"osd","service_id":"device_[0-9a-f]{64}","placement":\{"hosts":\["ceph-install-mock"\]\},"spec":\{"data_devices":\{"paths":\["/dev/sdb"\]\}\}\}$') | list | length == 2
          - ceph_mock_log.stdout_lines | select('equalto', 'ceph osd pool create test-pool 16') | list | length == 1
          - ceph_mock_log.stdout_lines | select('equalto', 'host-add ceph-b') | list | length == 1
          - ceph_mock_log.stdout_lines | select('equalto', 'host-add ceph-c') | list | length == 1
    - name: "Read final mocked host registration state"
      ansible.builtin.command: "cat /tmp/ceph-mock-state/hosts"
      register: ceph_mock_hosts
      changed_when: false
    - name: "Assert expected host registration converged exactly"
      ansible.builtin.assert:
        that:
          - ceph_mock_hosts.stdout_lines | sort == ['ceph-b', 'ceph-c', 'ceph-install-mock']
