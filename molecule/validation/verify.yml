---
- name: "Verify validation-only state"
  hosts: all
  gather_facts: false
  vars:
    ansible_facts:
      distribution: "Rocky"
      distribution_major_version: "9"
  tasks:
    - name: "Check no Ceph files were created"
      ansible.builtin.stat:
        path: "/etc/ceph/ceph.conf"
      register: ceph_config
    - name: "Assert validation made no changes"
      ansible.builtin.assert:
        that:
          - not ceph_config.stat.exists
    - name: "Reject malformed pool records and pg_num values"
      ansible.builtin.include_tasks: invalid_pool.yml
      loop:
        - { label: "scalar record", value: "not-a-pool" }
        - { label: "missing name", value: { pg_num: 8 } }
        - { label: "bool pg_num", value: { name: "bad-bool", pg_num: true } }
        - { label: "float pg_num", value: { name: "bad-float", pg_num: 1.5 } }
        - { label: "string pg_num", value: { name: "bad-string", pg_num: "8" } }
        - { label: "zero pg_num", value: { name: "bad-zero", pg_num: 0 } }
      loop_control:
        loop_var: invalid_pool_case
    - name: "Reject malformed or undeclared OSD host/device records"
      ansible.builtin.include_tasks: invalid_osd.yml
      loop:
        - { label: "OSD host not in inventory", value: [{ host: "not-in-inventory", device: "/dev/sdb" }] }
        - { label: "device path not absolute", value: [{ host: "ceph-validation", device: "sdb" }] }
        - { label: "duplicate device path", value: [{ host: "ceph-validation", device: "/dev/sdb" }, { host: "ceph-validation", device: "/dev/sdb" }] }
      loop_control:
        loop_var: invalid_osd_case
