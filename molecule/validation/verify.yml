---
- name: "Verify validation-only state"
  hosts: all
  gather_facts: false
  vars:
    ansible_facts:
      distribution: "Rocky"
      distribution_major_version: "9"
    validation_sentinel: "/tmp/ceph-validation-state-sentinel"
  tasks:
    - name: "Check validation sentinel is absent on target"
      ansible.builtin.stat:
        path: "{{ validation_sentinel }}"
      register: validation_sentinel_before
    - name: "Require a clean target before validation-only checks"
      ansible.builtin.assert:
        that:
          - not validation_sentinel_before.stat.exists
    - name: "Reject malformed pool records and pg_num values"
      ansible.builtin.include_tasks: invalid_pool.yml
      loop:
        - { label: "scalar record", value: "not-a-pool" }
        - { label: "missing name", value: { pg_num: 8 } }
        - { label: "bool pg_num", value: { name: "bad-bool", pg_num: true } }
        - { label: "float pg_num", value: { name: "bad-float", pg_num: 1.5 } }
        - { label: "string pg_num", value: { name: "bad-string", pg_num: "8" } }
        - { label: "zero pg_num", value: { name: "bad-zero", pg_num: 0 } }
      loop_control:
        loop_var: invalid_pool_case
    - name: "Reject malformed or undeclared OSD host/device records"
      ansible.builtin.include_tasks: invalid_osd.yml
      loop:
        - { label: "OSD host not in inventory", value: [{ host: "not-in-inventory", device: "/dev/sdb" }] }
        - { label: "device path not absolute", value: [{ host: "ceph-validation", device: "sdb" }] }
        - { label: "duplicate device path", value: [{ host: "ceph-validation", device: "/dev/sdb" }, { host: "ceph-validation", device: "/dev/sdb" }] }
        - { label: "duplicate host/device pair", value: [{ host: "ceph-validation", device: "/dev/sdb" }, { host: "ceph-validation", device: "/dev/sdb" }] }
      loop_control:
        loop_var: invalid_osd_case
    - name: "Reject OSD entries without explicit provisioning opt-in"
      ansible.builtin.include_tasks: reject_osd_without_opt_in.yml
    - name: "Declare a second host for positive OSD validation"
      ansible.builtin.add_host:
        name: "ceph-b"
        groups: "all"
    - name: "Accept the same device path on distinct hosts"
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../.."
      vars:
        state: "validate"
        iac_blueprint:
          ceph:
            cluster_name: "ceph"
            monitors: ["ceph-validation", "ceph-b", "ceph-c"]
            allow_osd_provisioning: true
            osds: [{ host: "ceph-validation", device: "/dev/sdb" }, { host: "ceph-b", device: "/dev/sdb" }]
            pools: []
    - name: "Check validation sentinel remains absent on target"
      ansible.builtin.stat:
        path: "{{ validation_sentinel }}"
      register: validation_sentinel_after
    - name: "Assert validation-only state left target untouched"
      ansible.builtin.assert:
        that:
          - not validation_sentinel_after.stat.exists
    - name: "Check actual role-generated OSD service identifiers do not collide"
      ansible.builtin.set_fact:
        generated_osd_service_ids: >-
          {{ (generated_osd_service_ids | default([])) +
             ['device_' ~ ((item.host ~ '|' ~ item.device) | hash('sha256'))] }}
      loop:
        - { host: "ceph-validation", device: "/dev/a-b" }
        - { host: "ceph-validation", device: "/dev/a_b" }
    - name: "Assert generated OSD service identifiers differ"
      ansible.builtin.assert:
        that:
          - generated_osd_service_ids | unique | length == 2
