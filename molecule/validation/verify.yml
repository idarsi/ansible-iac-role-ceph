---
- name: "Verify validation-only state"
  hosts: all
  gather_facts: false
  tasks:
    - name: "Check no Ceph files were created"
      ansible.builtin.stat:
        path: "/etc/ceph/ceph.conf"
      register: ceph_config
    - name: "Assert validation made no changes"
      ansible.builtin.assert:
        that:
          - not ceph_config.stat.exists
