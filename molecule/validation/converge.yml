---
- name: "Validate ceph blueprint"
  hosts: all
  gather_facts: false
  vars:
    ansible_facts:
      distribution: "Rocky"
      distribution_major_version: "9"
  tasks:
    - name: "Declare monitor peers used by validation"
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: "all"
      loop: ["ceph-b", "ceph-c", "ceph-client"]
      changed_when: false

    - name: "Run accepted validation contract"
      ansible.builtin.include_role:
        name: ansible-iac-role-ceph
      vars:
        state: "validate"
        iac_blueprint:
          ceph:
            cluster_name: "ceph"
            monitors: ["ceph-validation", "ceph-b", "ceph-c"]
            cluster_network: "10.20.0.0/24"
            osds: []
            pools:
              - name: "validation-pool"
                pg_num: 16
            filesystems: [{ name: "media", mds_count: 2 }]
            cephfs_clients:
              - { host: "ceph-client", filesystem: "media", mountpoint: "/srv/media", client_id: "media-client" }
              - { host: "ceph-validation", filesystem: "media", mountpoint: "/mnt/ceph_media", client_id: "media-validation" }

    - name: "Reject unsafe CephFS mountpoints"
      ansible.builtin.assert:
        that:
          - item is not match('^/(mnt|media|srv)/[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*$')
      loop: ["/", "/etc", "/usr/local", "/var/lib/ceph", "/mnt/../etc", "/srv//media", "/media/.", "/mnt/unsafe name"]
