---
- name: "Reset expected rejection marker"
  ansible.builtin.set_fact:
    invalid_pool_rejected: false

- name: "Confirm validation rejects {{ invalid_pool_case.label }}"
  block:
    - name: "Validate malformed pool record"
      ansible.builtin.include_role:
        name: ansible-iac-role-ceph
      vars:
        state: "validate"
        iac_blueprint:
          ceph:
            cluster_name: "ceph"
            monitors: ["ceph-validation", "ceph-b", "ceph-c"]
            osds: []
            pools: "{{ [invalid_pool_case.value] }}"
  rescue:
    - name: "Assert validation failed specifically for the pool definition"
      ansible.builtin.assert:
        that:
          - "'ceph.pools must contain unique non-empty names and positive integer pg_num values' in ansible_failed_result.msg"
        fail_msg: "{{ invalid_pool_case.label }} failed for an unexpected reason: {{ ansible_failed_result.msg }}"

    - name: "Record expected pool validation rejection"
      ansible.builtin.set_fact:
        invalid_pool_rejected: true

- name: "Assert {{ invalid_pool_case.label }} was not accepted"
  ansible.builtin.assert:
    that: invalid_pool_rejected | default(false)
    fail_msg: "Malformed pool case {{ invalid_pool_case.label }} unexpectedly passed validation"
