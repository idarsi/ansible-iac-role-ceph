---
driver:
  name: podman
platforms:
  - name: ceph-validation
    image: "quay.io/rockylinux/rockylinux:9"
    privileged: false
    command: "sleep infinity"
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  inventory:
    host_vars:
      ceph-validation:
        ansible_connection: local
        ansible_facts:
          distribution: Rocky
          distribution_major_version: "9"
        ansible_host: "192.0.2.10"
verifier:
  name: ansible
